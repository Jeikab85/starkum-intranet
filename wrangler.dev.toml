name = "intranet"
# Solo para pruebas locales (npm run dev). No se usa al publicar.
main = "dist/worker.js"
compatibility_date = "2024-11-01"

[vars]
ADMIN_EMAIL = "contact@starkumholdings.com"
MAIL_FROM = "intranet@velknoxiq.com"
DEV = "1"
VAULT_KEY = "solo-pruebas-locales-no-es-real-0001"

[[d1_databases]]
binding = "DB"
database_name = "intranet"
database_id = "local-dev"

[[r2_buckets]]
binding = "FILES"
bucket_name = "intranet-files"

[triggers]
crons = ["7 13 * * *"]

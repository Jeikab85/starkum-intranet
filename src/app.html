<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13262E">
<title>Intranet Starkum</title>
<link rel="icon" type="image/svg+xml" href="/brand/emblem.svg">
<link rel="alternate icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F6; --panel:#FFFFFF; --ink:#14232B; --muted:#5B6B73; --line:#DBE2E5; --line2:#E6ECEE;
  --accent:#0E6B6B; --accent-ink:#FFFFFF; --soft:#DCEFEE; --chip:#EEF3F4;
  --side:#13262E; --side-ink:#CFDDE2; --side-mute:#8AA3AC; --side-on:rgba(79,193,189,.18);
  --ok:#2F7D4F; --ok-bg:#E1F1E6; --warn:#8A5608; --warn-bg:#F8ECD6; --bad:#A8352C; --bad-bg:#F6E0DD; --warn-line:#E6B25A;
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-b:Manrope,"Segoe UI",system-ui,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1A1F; --panel:#16242B; --ink:#E4ECEF; --muted:#9AACB3; --line:#26373F; --line2:#22323A;
  --accent:#4FC1BD; --accent-ink:#0B1A1E; --soft:#173A3B; --chip:#1C2D34;
  --side:#0A1418; --side-ink:#B7C8CE; --side-mute:#7F97A0;
  --ok:#6FCF93; --ok-bg:#173326; --warn:#E6B25A; --warn-bg:#3A2D15; --bad:#EC8A80; --bad-bg:#3D1E1B; --warn-line:#B98A3A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,3.2vw,34px)} h2{font-size:18px} h3{font-size:16px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--f-m);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.app{display:flex;min-height:100vh}
.side{width:260px;flex:none;background:var(--side);color:var(--side-ink);padding:26px 16px calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none!important}
.brandtext{display:flex;flex-direction:column;line-height:1.15}
.brandtext b{font-family:var(--f-d);font-size:18px;color:#fff}
.brandtext span{font-family:var(--f-m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9FB6BE;margin-top:3px}
.emblem{display:inline-flex;flex:none;line-height:0}.emblem img{display:block}
.emblem.light{background:linear-gradient(180deg,#fff,#eef2f1);border-radius:10px;padding:3px 6px}
@media (prefers-color-scheme: dark){.emblem.auto{background:linear-gradient(180deg,#fff,#eef2f1);border-radius:14px;padding:6px 12px}}
.logo{position:relative;overflow:hidden;display:inline-block;flex:none}
.logo img{position:absolute;max-width:none}
.logo.light img{filter:brightness(0) invert(1)}
@media (prefers-color-scheme: dark){.logo.auto img{filter:brightness(0) invert(1)}}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label{font-family:var(--f-m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-mute);padding:0 12px 4px}
.navgroup a{display:block;padding:9px 12px;border-radius:8px;color:var(--side-ink);font-weight:600}
.navgroup a:hover{background:rgba(255,255,255,.06);text-decoration:none}
.navgroup a.on{background:var(--side-on);color:#fff}
.navgroup a.add{color:var(--side-mute)}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:12px 4px 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.who b{color:#fff}
.who button{background:none;border:0;color:var(--side-mute);padding:0;text-align:left;cursor:pointer;font-weight:600}
.topbar{display:none}
main{flex:1;min-width:0;padding:32px clamp(16px,3.4vw,44px) 64px;padding-right:max(clamp(16px,3.4vw,44px),env(safe-area-inset-right,0px))}
.page{max-width:1240px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.head>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.head>div.row:first-child{flex-direction:row}
.crumbs{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card>h2{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
body[data-role=standard] .only-admin,body[data-role=viewer] .only-admin,body[data-role=viewer] .only-upload{display:none!important}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger[type=submit]{background:var(--bad);color:#fff}
.btn:disabled{opacity:.55;cursor:progress}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 2px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.chip{font-size:13px;padding:5px 10px;border-radius:7px;background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.pill.info{background:var(--chip);color:var(--accent)}
a.chip{color:var(--ink)} a.chip:hover{text-decoration:none;filter:brightness(.97)} a.chip.on{background:var(--accent);color:#fff}
.codebtn{align-self:flex-start;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:4px 8px;font-size:13px;cursor:pointer}
.ceil b{font-size:22px;margin-left:6px}
pre.draft{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--chip);border-radius:10px;padding:14px;margin:0;max-height:420px;overflow:auto}
details.card summary{cursor:pointer}
fieldset .chips label.chip{cursor:pointer}
.cardchip{width:118px;height:74px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#0b3f44);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:9px 11px;flex:none;font-size:12px}
.cardchip b{font-size:14px;letter-spacing:.5px}
.cardchip.debit{background:linear-gradient(135deg,#3d5a80,#1d2d44)}
ol.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
ol.stages li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:2px;font:inherit;font-size:12px;cursor:pointer;min-height:52px}
ol.stages li button:disabled{cursor:default}
ol.stages li.done button{background:var(--chip);color:var(--ink)}
ol.stages li.cur button{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
ol.stages li b{font-size:12.5px}
.chooser{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px}
.chooserhead{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.chooserhead h1{font-size:28px}
.entpick{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:20px;width:100%;justify-content:center}
@media (max-width:640px){.entpick{grid-template-columns:minmax(0,1fr)}}
.entcard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:border-color .15s,transform .15s}
.entcard:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-2px)}
.entwrap{display:flex;flex-direction:column;align-items:center;gap:10px}.entwrap>.entcard{width:100%}
.weblink{font-weight:700;color:var(--accent);white-space:nowrap}
.entlogo{display:grid;place-items:center;border-radius:20px;background:#fff;border:1px solid var(--line);overflow:hidden;flex:none}
.entlogo img{max-width:82%;max-height:82%;object-fit:contain}
.entlogo .logo img{max-width:none;max-height:none}
.entgo{font-size:22px;color:var(--accent);font-weight:700}
.side a.entswitch{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.side a.entswitch span{font-size:12px;opacity:.7}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.toolwrap{position:relative}
.tooltile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:14px;color:var(--ink);text-align:center}
.tooltile:hover{background:var(--chip);text-decoration:none}
.tooltile b{font-size:13px;line-height:1.25}
.toolimg{width:64px;height:64px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.toolimg img{width:40px;height:40px;object-fit:contain}
.toolletter{font-size:26px;font-weight:800;color:var(--accent)}
.tooledit{position:absolute;top:4px;right:4px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;border-radius:6px}
.tooledit:hover{background:var(--chip);color:var(--ink)}
@media (max-width:760px){ol.stages{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bizcard{display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.bizcard:hover{border-color:var(--accent);text-decoration:none}
.bizcard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bizcard .top b{font-family:var(--f-d);font-size:19px}
.list>*{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2);color:var(--ink)}
.list>*:first-child{border-top:0}
.list a:hover{text-decoration:none;color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px 8px 0}
td{padding:11px 10px 11px 0;border-top:1px solid var(--line2);vertical-align:top}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg a{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600}
.seg a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg a:hover{text-decoration:none}
.cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.col{flex:1 1 150px;display:flex;flex-direction:column;gap:5px;min-width:0}
.col a,.folder a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink)}
.col a:hover,.folder a:hover{background:var(--chip);text-decoration:none}
.col a.on,.folder a.on{background:var(--soft);font-weight:700}
.col a span,.folder a span{color:var(--muted);font-weight:500}
.filerow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:11px;border:1px solid var(--line2);border-radius:10px}
.filerow .thumb{width:42px;height:52px;flex:none;border-radius:6px;background:var(--chip);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-m);font-size:10.5px;color:var(--muted)}
.filerow .info{flex:1 1 200px;min-width:0;display:flex;flex-direction:column}
.filerow .info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
.field.low{color:var(--warn)} .field.low input{border:2px solid var(--warn-line)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0;background:var(--panel);min-width:0}
legend{font-family:var(--f-d);font-weight:600;font-size:16px;padding:0 6px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.check{display:flex;gap:10px;align-items:baseline;padding:4px 0}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:16px}
.preview img{width:100%;border-radius:6px;display:block}
.preview iframe{width:100%;height:72vh;border:0;border-radius:6px;background:#fff}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split>.l{flex:1 1 340px;max-width:480px;min-width:0}
.split>.r{flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px}
.meter{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,24,.55)}
dialog form{display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--side)}
.login .box{background:var(--panel);border-radius:16px;padding:30px;width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.login .mark{display:flex;align-items:center;gap:12px;font-family:var(--f-d);font-size:22px;font-weight:700}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column} .kv span{font-size:12px;color:var(--muted)} .kv b{font-size:16px}
.stat b{font-family:var(--f-m);font-size:21px}
@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:min(290px,86vw);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,20,24,.5)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30;background:var(--side);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar b{font-family:var(--f-d);font-size:19px}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;min-height:40px;padding:6px 12px;font-weight:700}
  main{padding-top:20px}
  .preview{position:static} .preview iframe{height:60vh}
}
</style>
</head>
